name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      -
        run: go test -v ./...
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      -
        name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.37.1
