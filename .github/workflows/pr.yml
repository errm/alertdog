name: Docker PR

on:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      -
        name: Login to DockerHub
        # Skip pushing images to Docker Hub in pull requests from forks
        # because they can't access to Actions secrets.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ secrets.DOCKERHUB_PR_REPO || 'alertdog' }}:${{ env.GITHUB_HEAD_REF_SLUG }}
          platforms: linux/amd64,linux/arm64
          provenance: false
